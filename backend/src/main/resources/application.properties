spring.application.name=backend

# ===============================
# LOCAL PROFILE
# ===============================
# Development-only overrides are loaded from application-local.properties.
# This file should remain gitignored.
spring.profiles.include=local

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/distributrack_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
# Railway provides PORT automatically.
# Locally, it defaults to 8080.
server.port=${PORT:8080}

# ===============================
# JWT CONFIGURATION
# ===============================
# Production/Railway must provide APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET}

# ===============================
# FIRST ADMIN SETUP
# ===============================
# No user is created automatically.
# The first SUPER_ADMIN is created manually through:
# POST /api/setup/first-admin
#
# Production must provide:
# DB_URL
# DB_USERNAME
# DB_PASSWORD
# APP_JWT_SECRET

# ===============================
# PAYMENT GATEWAY
# ===============================
# Default is mock mode for local development.
app.payment.mode=${PAYMENT_MODE:mock}

app.payment.key-id=${RAZORPAY_KEY_ID:}
app.payment.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Only used when PAYMENT_MODE=mock.
app.payment.mock-secret=${PAYMENT_MOCK_SECRET:}

app.payment.api-url=${RAZORPAY_API_URL:https://api.razorpay.com/v1}

# ===============================
# EMAIL NOTIFICATIONS
# ===============================
# Real email delivery requires EMAIL_ENABLED=true
# and the SMTP environment variables below.
app.notifications.email.enabled=${EMAIL_ENABLED:false}
app.notifications.email.from=${EMAIL_FROM:DistribuTrack <no-reply@distributrack.local>}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ===============================
# SMS NOTIFICATIONS
# ===============================
# Default provider is log/mock mode.
app.sms.provider=${SMS_PROVIDER:log}
app.sms.api-url=${SMS_API_URL:}
app.sms.api-key=${SMS_API_KEY:}
app.sms.sender=${SMS_SENDER:DistribuTrack}

# ===============================
# DISTRIBUTOR IDENTITY
# ===============================
# Never hardcode the production UPI ID.
app.distributor.upi-id=${DISTRIBUTOR_UPI_ID:}

# ===============================
# FRONTEND URL
# ===============================
# Used for password-reset links and other frontend redirects.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}