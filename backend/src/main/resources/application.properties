spring.application.name=backend

# ===============================
# LOCAL PROFILE
# ===============================
# Automatically loads application-local.properties which contains
# development-only overrides (UPI ID, etc.). This file is gitignored.
# To disable, remove this line or use --spring.profiles.active=dev
# on the command line.
spring.profiles.include=local

# ===============================
# DATABASE CONFIG==============
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/distributrack_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# FIRST ADMIN SETUP
# No user is ever created automatically. The first SUPER_ADMIN is
# created manually via POST /api/setup/first-admin (see SetupService),
# which is only available while the users table is empty.
# ===============================
# Production must override DB_URL / DB_USERNAME / DB_PASSWORD via
# environment variables.

# ===============================
# PAYMENT GATEWAY
# ===============================
# app.payment.mode=mock is the default: the built-in development
# gateway (same verification mechanics, no real money). Switch to
# app.payment.mode=sandbox and provide the Razorpay test keys to run
# against the real Razorpay sandbox.
app.payment.mode=${PAYMENT_MODE:mock}
app.payment.key-id=${RAZORPAY_KEY_ID:}
app.payment.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payment.mock-secret=${PAYMENT_MOCK_SECRET:distributrack-dev-mock-secret}
app.payment.api-url=${RAZORPAY_API_URL:https://api.razorpay.com/v1}

# ===============================
# EMAIL NOTIFICATIONS
# ===============================
# Real delivery is enabled by setting EMAIL_ENABLED=true plus the SMTP
# connection (MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD /
# EMAIL_FROM). With no SMTP host configured the EmailService runs in
# mock mode and logs every message as [EMAIL MOCK].
app.notifications.email.enabled=${EMAIL_ENABLED:false}
app.notifications.email.from=${EMAIL_FROM:DistribuTrack <no-reply@distributrack.local>}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ===============================
# SMS NOTIFICATIONS
# ===============================
# Default provider is "log" (messages printed as [SMS MOCK]). Set
# app.sms.provider=http plus SMS_API_URL / SMS_API_KEY / SMS_SENDER to
# enable a real HTTP SMS gateway (Textlocal/MSG91/Twilio-style API).
app.sms.provider=${SMS_PROVIDER:log}
app.sms.api-url=${SMS_API_URL:}
app.sms.api-key=${SMS_API_KEY:}
app.sms.sender=${SMS_SENDER:DistribuTrack}

# ===============================
# DISTRIBUTOR IDENTITY
# ===============================
# UPI VPA for direct shopkeeper payments. Set via DISTRIBUTOR_UPI_ID
# environment variable. Never hardcode in source files.
app.distributor.upi-id=${DISTRIBUTOR_UPI_ID:}

# ===============================
# FRONTEND URL
# ===============================
# Used to build password-reset links in emails. Override via
# DISTRIBUTOR_UPI_ID env var in production.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}