# ============================================================================
# DistribuTrack — local/production Docker stack
#   docker compose up --build
#
# Configuration comes from the environment (see backend/.env.example and
# frontend/.env.example). Never commit real secrets.
# ============================================================================
services:

  db:
    image: mysql:8.0
    container_name: distributrack-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: distributrack_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: distributrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/distributrack_db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-long-random-secret}
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: distributrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
